# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/api"
      - "/hack/tools"
    schedule:
      interval: "weekly"
    groups:
      # Security updates are not covered by version-update groups, so without this group
      # Dependabot opens one PR per alerted module. When a single advisory spans several
      # modules (e.g. go.opentelemetry.io/otel/sdk and go.opentelemetry.io/otel/trace), each
      # PR fails govulncheck because the other module is still vulnerable on its branch.
      all-go-mod-security:
        applies-to: security-updates
        patterns: [ "*" ]
      # controller-runtime and k8s.io modules must be upgraded in lockstep, so keep them
      # together in a dedicated PR, separate from the catch-all group below.
      # From Dependabot docs:
      #    > If a dependency matches more than one rule, it's included in the first group that it matches.
      k8s:
        patterns: [ "sigs.k8s.io/controller-runtime", "k8s.io/*" ]
        update-types: [ "minor", "patch" ]
      all-go-mod-patch-and-minor:
        patterns: [ "*" ]
        update-types: [ "patch", "minor" ]

  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
